<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#07111c"><title>Jackson Chores</title><style>:root{--bg:#07111c;--panel:#102033;--panel2:#15293e;--line:#29455f;--text:#f8fbff;--muted:#9db0c4;--indie:#ff5aa8;--lola:#28c8ff;--gideon:#49e47e;--good:#44d98a}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101a;color:var(--text);font-family:Arial,Helvetica,sans-serif}body{padding:10px;background:radial-gradient(circle at 12% 0,rgba(255,90,168,.10),transparent 27%),radial-gradient(circle at 50% 0,rgba(40,200,255,.10),transparent 27%),radial-gradient(circle at 90% 0,rgba(73,228,126,.10),transparent 27%),linear-gradient(180deg,#07111c,#081522 60%,#07111c)}button{font:inherit}.app{height:100%;display:grid;grid-template-rows:58px minmax(0,1fr) 100px 22px;gap:8px}.head{display:flex;align-items:center;justify-content:space-between;padding:0 4px}.brand{display:flex;align-items:center;gap:10px}.mark{width:32px;height:22px;position:relative}.mark:before,.mark:after{content:"";position:absolute;top:1px;width:10px;height:22px;border-radius:12px;transform:rotate(32deg);background:linear-gradient(#ff4a66,#ff3359)}.mark:before{left:2px}.mark:after{left:16px;opacity:.72}.brand h1{font-size:28px;line-height:1;margin:0;letter-spacing:-.5px}.tag{font-size:9px;letter-spacing:2.7px;color:#a9bad0;margin-top:4px}.headRight{display:flex;align-items:center;gap:10px}.date{text-align:right;color:var(--muted);font-size:13px;line-height:1.15}.date b{display:block;color:#fff;font-size:18px}.gear{width:40px;height:40px;border-radius:12px;border:1px solid #42607b;background:#122538;color:#d7e4ef;font-size:20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;min-height:0}.card{min-height:0;display:grid;grid-template-rows:70px minmax(0,1fr);border-radius:18px;padding:9px;background:linear-gradient(180deg,#13283b,#0d1c2c);border:1px solid var(--line);overflow:hidden;position:relative}.card:before{content:"";position:absolute;left:0;right:0;top:0;height:76px;opacity:.34;pointer-events:none}.card.indie{border-color:rgba(255,90,168,.58)}.card.indie:before{background:linear-gradient(135deg,rgba(255,90,168,.8),rgba(140,82,255,.25),transparent)}.card.lola{border-color:rgba(40,200,255,.55)}.card.lola:before{background:linear-gradient(135deg,rgba(40,200,255,.72),rgba(23,120,255,.20),transparent)}.card.gideon{border-color:rgba(73,228,126,.55)}.card.gideon:before{background:linear-gradient(135deg,rgba(73,228,126,.72),rgba(0,168,107,.18),transparent)}.cardtop{z-index:1;display:flex;justify-content:space-between;align-items:flex-start}.kidhead{display:flex;gap:7px;align-items:center}.kidglyph{width:22px;height:22px;border-radius:7px;border:2px solid currentColor;display:grid;place-items:center;font-size:12px;font-weight:900}.indie .kidglyph,.indie .role{color:#ff85c0}.lola .kidglyph,.lola .role{color:#72dcff}.gideon .kidglyph,.gideon .role{color:#81f0a6}.name{font-size:24px;font-weight:900;letter-spacing:-.4px}.role{font-size:13px;font-weight:800;margin-top:3px}.ring{--p:0;--c:#fff;width:47px;height:47px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.11) 0);display:grid;place-items:center;position:relative}.ring:after{content:"";position:absolute;width:34px;height:34px;border-radius:50%;background:#0e1d2c}.ring span{z-index:1;font-size:10px;font-weight:900}.indie .ring{--c:var(--indie)}.lola .ring{--c:var(--lola)}.gideon .ring{--c:var(--gideon)}.tasks{min-height:0;display:grid;gap:5px}.task{min-height:0;width:100%;display:grid;grid-template-columns:24px 1fr;align-items:center;column-gap:8px;text-align:left;padding:6px 8px;border-radius:11px;border:1px solid rgba(158,184,210,.20);background:linear-gradient(180deg,#1a3148,#14283b);color:#fff;font-size:14px;line-height:1.12}.box{width:23px;height:23px;border:2px solid #8193a5;border-radius:6px;display:grid;place-items:center;font-size:14px;font-weight:900}.task.done{background:linear-gradient(180deg,rgba(50,113,82,.92),rgba(28,75,55,.95));border-color:rgba(68,217,138,.75)}.task.done .box{background:var(--good);border-color:var(--good);color:#062416}.task.done .label{text-decoration:line-through;color:#e0f8e9}.personal{border-radius:17px;border:1px solid #28445e;background:linear-gradient(180deg,#102337,#0d1d2d);padding:8px 10px;overflow:hidden}.ptop{display:flex;justify-content:space-between;align-items:end;height:24px}.ptop b{font-size:17px}.ptop span{font-size:10px;color:var(--muted)}.personalgrid{height:60px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:5px}.prow{display:grid;grid-template-columns:90px 1fr;align-items:center;border-right:1px solid rgba(157,181,205,.15);padding-right:8px}.prow:last-child{border-right:0;padding-right:0}.pname{font-size:15px;font-weight:900}.basics{font-size:9px;color:var(--muted);line-height:1.25;margin-top:2px}.alldone{height:46px;border-radius:11px;border:1px solid rgba(158,184,210,.25);background:#182d42;color:#dbe5ee;font-size:13px;font-weight:900}.alldone.done{background:linear-gradient(#4be096,#2bc276);border-color:#58e89d;color:#062416}.foot{display:flex;justify-content:space-between;align-items:center;padding:0 3px;color:#70859a;font-size:9px;letter-spacing:1px;text-transform:uppercase}.modalbg{display:none;position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.78);align-items:center;justify-content:center}.modal{width:380px;background:#102236;border:1px solid #35526d;border-radius:16px;padding:18px}.modal h2{margin:0 0 8px}.modal p{color:var(--muted)}.modalbuttons{display:flex;justify-content:flex-end;gap:8px}.action{padding:10px 14px;border-radius:9px;border:1px solid #35526d;background:#173047;color:#fff}</style></head><body><div class="app"><header class="head"><div class="brand"><div class="mark"></div><div><h1>Jackson Chores</h1><div class="tag">SMALL JOBS&nbsp;&nbsp; BIG PEOPLE</div></div></div><div class="headRight"><div class="date"><b id="day"></b><span id="date"></span></div><button class="gear" id="settings">⚙</button></div></header><main class="cards" id="cards"></main><section class="personal"><div class="ptop"><b>Every Day</b><span>Bed • Clothes • Dishes • Floor • Rubbish</span></div><div class="personalgrid" id="personal"></div></section><footer class="foot"><span>Consistency today creates freedom tomorrow</span><span>Jackson Family ♥</span></footer></div><div class="modalbg" id="modal"><div class="modal"><h2>Reset today?</h2><p>Clear every tick for today?</p><div class="modalbuttons"><button class="action" id="cancel">Cancel</button><button class="action" id="reset">Reset</button></div></div></div><script>(function(){var kids=['Indie','Lola','Gideon'],kidClass=['indie','lola','gideon'],kidGlyph=['D','K','H'];var roles=[{name:'Dogs & Outside',tasks:['Pick up dog poo','Clean & refill dog water','Feed the dogs','Pool robot + clean filter','Quick outdoor tidy']},{name:'Kitchen',tasks:['Unload dishwasher','Clear / load dinner dishes','Wipe table & benches','Rubbish & recycling']},{name:'House',tasks:['Vacuum / sweep main area','Reset lounge room','Collect laundry & towels','Fold / put away washing if needed']}];var anchor=new Date(2026,8,9,12);function pad(n){return n<10?'0'+n:n}function dk(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function diff(a,b){return Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate(),12)-new Date(a.getFullYear(),a.getMonth(),a.getDate(),12))/86400000)}function mod(n,m){return((n%m)+m)%m}var now=new Date(),key=dk(now),off=mod(diff(anchor,now),3);function role(i){return roles[mod(i+off,3)]}function sk(i,t,j){return'jackson-chores:'+key+':'+i+':'+t+':'+j}function done(i,t,j){return localStorage.getItem(sk(i,t,j))==='1'}function set(i,t,j,v){if(v)localStorage.setItem(sk(i,t,j),'1');else localStorage.removeItem(sk(i,t,j))}function everydayDone(i){return localStorage.getItem(sk(i,'every','all'))==='1'}function taskButton(i,j,label){var b=document.createElement('button');b.className='task'+(done(i,'role',j)?' done':'');b.innerHTML='<span class="box">'+(done(i,'role',j)?'✓':'')+'</span><span class="label">'+label+'</span>';b.onclick=function(){set(i,'role',j,!done(i,'role',j));build()};return b}function counts(i){var r=role(i),d=everydayDone(i)?1:0,total=r.tasks.length+1;r.tasks.forEach(function(_,j){if(done(i,'role',j))d++});return[d,total]}function build(){document.getElementById('day').textContent=now.toLocaleDateString(undefined,{weekday:'long'});document.getElementById('date').textContent=now.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});var c=document.getElementById('cards');c.innerHTML='';kids.forEach(function(k,i){var r=role(i),n=counts(i),pct=Math.round(n[0]/n[1]*100),card=document.createElement('section');card.className='card '+kidClass[i];card.innerHTML='<div class="cardtop"><div><div class="kidhead"><span class="kidglyph">'+kidGlyph[i]+'</span><div class="name">'+k+'</div></div><div class="role">'+r.name+'</div></div><div class="ring" style="--p:'+pct+'"><span>'+n[0]+'/'+n[1]+'</span></div></div>';var ts=document.createElement('div');ts.className='tasks';ts.style.gridTemplateRows='repeat('+r.tasks.length+',1fr)';r.tasks.forEach(function(t,j){ts.appendChild(taskButton(i,j,t))});card.appendChild(ts);c.appendChild(card)});var p=document.getElementById('personal');p.innerHTML='';kids.forEach(function(k,i){var row=document.createElement('div');row.className='prow';row.innerHTML='<div><div class="pname">'+k+'</div><div class="basics">5 basics</div></div>';var b=document.createElement('button');b.className='alldone'+(everydayDone(i)?' done':'');b.textContent=everydayDone(i)?'✓ ALL DONE':'ALL DONE';b.onclick=function(){set(i,'every','all',!everydayDone(i));build()};row.appendChild(b);p.appendChild(row)})}document.getElementById('settings').onclick=function(){document.getElementById('modal').style.display='flex'};document.getElementById('cancel').onclick=function(){document.getElementById('modal').style.display='none'};document.getElementById('reset').onclick=function(){kids.forEach(function(_,i){role(i).tasks.forEach(function(_,j){localStorage.removeItem(sk(i,'role',j))});localStorage.removeItem(sk(i,'every','all'))});document.getElementById('modal').style.display='none';build()};setInterval(function(){if(dk(new Date())!==key)location.reload()},60000);build()})();</script></body></html>
