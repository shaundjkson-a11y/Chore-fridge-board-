<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111c">
<title>Jackson Chores</title>
<style>
:root{
  --bg:#07111c;--bg2:#0a1724;--panel:rgba(15,27,40,.88);--panel2:rgba(20,34,49,.92);
  --line:rgba(159,181,205,.18);--text:#f5f8fc;--muted:#8fa2b7;--soft:#cbd6e2;
  --indie:#ff5aa8;--indie2:#8c52ff;--lola:#28c8ff;--lola2:#1778ff;--gideon:#49e47e;--gideon2:#00a86b;
  --good:#44d98a;--shadow:0 18px 44px rgba(0,0,0,.28)
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
body{padding:14px;background:
 radial-gradient(circle at 8% 4%,rgba(255,90,168,.10),transparent 28%),
 radial-gradient(circle at 54% 4%,rgba(40,200,255,.10),transparent 28%),
 radial-gradient(circle at 92% 8%,rgba(73,228,126,.10),transparent 30%),
 linear-gradient(180deg,#07111c 0%,#08131f 56%,#07111c 100%)}
body:before{content:"";position:fixed;inset:0;pointer-events:none;opacity:.18;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:42px 42px}
button{font:inherit}.app{max-width:1080px;margin:auto;position:relative;z-index:1}
.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;padding:1px 2px 0}
.brand{display:flex;align-items:center;gap:12px}.mark{width:34px;height:22px;position:relative}.mark:before,.mark:after{content:"";position:absolute;top:1px;width:10px;height:22px;border-radius:12px;transform:rotate(32deg);background:linear-gradient(180deg,#ff4a66,#ff3359)}.mark:before{left:3px}.mark:after{left:17px;opacity:.72}
.head h1{font-size:29px;margin:0;letter-spacing:-.7px}.tagline{font-size:9px;letter-spacing:3px;color:#9db1c7;margin-top:2px}.headline{display:flex;align-items:center;gap:10px}.date{text-align:right;color:var(--muted);font-size:14px;line-height:1.2}.date b{display:block;color:var(--text);font-size:18px;letter-spacing:.2px}.gear{width:38px;height:38px;border-radius:12px;border:1px solid rgba(159,181,205,.28);background:rgba(18,33,48,.76);color:#b9c7d6;font-size:20px;display:grid;place-items:center}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(18,31,46,.96),rgba(9,19,30,.96));border:1px solid var(--line);border-radius:20px;padding:11px;box-shadow:var(--shadow)}
.card:before{content:"";position:absolute;inset:0 0 auto;height:88px;opacity:.42;pointer-events:none}.card.indie:before{background:linear-gradient(135deg,rgba(255,90,168,.48),rgba(140,82,255,.15),transparent)}.card.lola:before{background:linear-gradient(135deg,rgba(40,200,255,.42),rgba(23,120,255,.14),transparent)}.card.gideon:before{background:linear-gradient(135deg,rgba(73,228,126,.42),rgba(0,168,107,.14),transparent)}
.card.indie{border-color:rgba(255,90,168,.40)}.card.lola{border-color:rgba(40,200,255,.36)}.card.gideon{border-color:rgba(73,228,126,.36)}.card.complete{box-shadow:0 0 0 1px rgba(68,217,138,.35),0 18px 44px rgba(0,0,0,.28)}
.cardtop{position:relative;display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:8px;z-index:1}.kidrow{display:flex;align-items:center;gap:8px}.kidicon{font-size:20px}.name{font-size:25px;font-weight:900;letter-spacing:-.4px}.role{font-weight:800;font-size:13px;margin-top:2px;letter-spacing:.2px}.indie .role{color:#ff84c0}.lola .role{color:#71dcff}.gideon .role{color:#79f0a2}
.ring{--p:0;--c:#fff;width:48px;height:48px;border-radius:50%;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.10) 0);display:grid;place-items:center;position:relative;box-shadow:inset 0 0 0 1px rgba(255,255,255,.07)}.ring:after{content:"";position:absolute;width:34px;height:34px;border-radius:50%;background:#0e1b29}.ring span{position:relative;z-index:1;font-size:11px;font-weight:800}.indie .ring{--c:var(--indie)}.lola .ring{--c:var(--lola)}.gideon .ring{--c:var(--gideon)}
.tasks{display:grid;gap:6px;position:relative;z-index:1}.task{border:1px solid rgba(157,179,202,.16);background:linear-gradient(180deg,rgba(27,43,59,.88),rgba(20,34,48,.88));color:var(--text);border-radius:12px;padding:7px 9px;min-height:42px;display:flex;align-items:center;gap:8px;text-align:left;width:100%;font-size:14px;line-height:1.15;box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}.task .ico{width:23px;text-align:center;font-size:16px;opacity:.96}.box{width:22px;height:22px;border:2px solid #6e7f92;border-radius:6px;flex:0 0 22px;display:grid;place-items:center;font-size:14px;font-weight:900}.task.done{background:linear-gradient(180deg,rgba(33,99,70,.46),rgba(16,59,43,.54));border-color:rgba(68,217,138,.60)}.task.done .box{background:var(--good);border-color:var(--good);color:#062416}.task.done .label{text-decoration:line-through;color:#d7f5e5}.task:active{transform:scale(.995)}
.personal{margin-top:9px;background:linear-gradient(180deg,rgba(16,29,43,.94),rgba(10,20,31,.94));border:1px solid rgba(159,181,205,.20);border-radius:18px;padding:9px 11px;box-shadow:var(--shadow)}.ptitle{display:flex;justify-content:space-between;align-items:end;margin-bottom:6px}.ptitle .left b{font-size:18px}.miniTag{font-size:9px;letter-spacing:2px;color:#8397ae;margin-top:2px}.ptitle span{font-size:10px;color:var(--muted)}.personalgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.prow{padding-right:8px;border-right:1px solid rgba(159,181,205,.14)}.prow:last-child{border:0;padding-right:0}.pname{font-size:14px;font-weight:900;margin-bottom:5px}.pchecks{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.pcheck{border:1px solid rgba(157,179,202,.16);background:rgba(24,39,54,.88);color:var(--soft);border-radius:8px;height:36px;font-size:10px;display:grid;place-items:center;text-align:center;padding:2px;line-height:1.05}.pcheck.done{background:linear-gradient(180deg,#48dc8d,#2cbf73);border-color:#59e99b;color:#062416;font-weight:900}.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:5px;color:#74869a;font-size:9px;text-align:center}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:7px;color:#72869b;font-size:9px;letter-spacing:.6px;padding:0 2px}.quote{font-size:9px;letter-spacing:1.4px;text-transform:uppercase}.family{display:flex;align-items:center;gap:6px}.heart{color:#ff4d67;font-size:12px}
.modalbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.72);align-items:center;justify-content:center;padding:20px;z-index:50}.modal{background:#0f1d2b;border:1px solid rgba(159,181,205,.24);border-radius:18px;padding:18px;max-width:420px;box-shadow:var(--shadow)}.modal h2{margin-top:0}.modal p{color:var(--muted)}.modalbuttons{display:flex;justify-content:flex-end;gap:8px}.action{border:1px solid rgba(159,181,205,.22);background:#192b3d;color:var(--text);padding:10px 14px;border-radius:10px}
@media(max-width:700px){body{padding:9px}.head h1{font-size:23px}.tagline{display:none}.cards{grid-template-columns:1fr}.card{padding:10px}.tasks{grid-template-columns:repeat(2,1fr)}.task{min-height:48px}.personalgrid{grid-template-columns:1fr}.prow{border-right:0;border-bottom:1px solid var(--line);padding:0 0 7px}.prow:last-child{border-bottom:0}.legend{display:none}.foot{font-size:8px}}
@media(min-width:701px) and (orientation:portrait){html,body{height:100%;overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.cards{flex:1;min-height:0}.card{display:flex;flex-direction:column}.tasks{flex:1;grid-auto-rows:1fr}.task{min-height:0}.personal{margin-top:8px}.head{margin-bottom:8px}}
</style>
</head>
<body>
<div class="app">
  <header class="head">
    <div class="brand"><div class="mark"></div><div><h1>Jackson Chores</h1><div class="tagline">SMALL JOBS&nbsp;&nbsp; BIG PEOPLE</div></div></div>
    <div class="headline"><div class="date"><b id="day"></b><span id="date"></span></div><button class="gear" id="settings" aria-label="Settings">⚙</button></div>
  </header>
  <main class="cards" id="cards"></main>
  <section class="personal">
    <div class="ptitle"><div class="left"><b>Every Day</b><div class="miniTag">THE BASICS</div></div><span>Tap each box when done</span></div>
    <div class="personalgrid" id="personal"></div>
    <div class="legend"><span>Bed</span><span>Clothes</span><span>Dishes</span><span>Floor</span><span>Rubbish</span></div>
  </section>
  <footer class="foot"><span class="quote">Consistency today creates freedom tomorrow</span><span class="family">JACKSON FAMILY <span class="heart">♥</span></span></footer>
</div>
<div class="modalbg" id="modal"><div class="modal"><h2>Reset today?</h2><p>Clear all of today's ticks?</p><div class="modalbuttons"><button class="action" id="cancel">Cancel</button><button class="action" id="reset">Reset</button></div></div></div>
<script>
(function(){
var kids=['Indie','Lola','Gideon'];
var kidClass=['indie','lola','gideon'];
var kidIcons=['🐾','🍴','⌂'];
var taskIcons={
 'Pick up dog poo':'💩','Clean & refill dog water':'◉','Feed the dogs':'🦴','Pool robot + clean filter':'▣','Quick outdoor tidy':'✦',
 'Unload dishwasher':'▤','Clear / load dinner dishes':'◫','Wipe table & benches':'▱','Rubbish & recycling':'♲',
 'Vacuum / sweep main area':'⌁','Reset lounge room':'▰','Collect laundry & towels':'♨','Fold / put away washing if needed':'▦'
};
var roles=[
{name:'Dogs & Outside',tasks:['Pick up dog poo','Clean & refill dog water','Feed the dogs','Pool robot + clean filter','Quick outdoor tidy']},
{name:'Kitchen',tasks:['Unload dishwasher','Clear / load dinner dishes','Wipe table & benches','Rubbish & recycling']},
{name:'House',tasks:['Vacuum / sweep main area','Reset lounge room','Collect laundry & towels','Fold / put away washing if needed']}
];
var personals=['Bed','Clothes','Dishes','Floor','Rubbish'];
var anchor=new Date(2026,8,9,12);
function pad(n){return n<10?'0'+n:n}
function dk(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function diff(a,b){return Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate(),12)-new Date(a.getFullYear(),a.getMonth(),a.getDate(),12))/86400000)}
function mod(n,m){return((n%m)+m)%m}
var now=new Date(),key=dk(now),off=mod(diff(anchor,now),3);
function role(i){return roles[mod(i+off,3)]}
function sk(i,t,j){return'jackson-chores:'+key+':'+i+':'+t+':'+j}
function done(i,t,j){return localStorage.getItem(sk(i,t,j))==='1'}
function set(i,t,j,v){if(v)localStorage.setItem(sk(i,t,j),'1');else localStorage.removeItem(sk(i,t,j))}
function taskButton(i,j,label){var b=document.createElement('button');b.className='task'+(done(i,'role',j)?' done':'');b.innerHTML='<span class="box">'+(done(i,'role',j)?'✓':'')+'</span><span class="ico">'+(taskIcons[label]||'•')+'</span><span class="label">'+label+'</span>';b.onclick=function(){set(i,'role',j,!done(i,'role',j));build()};return b}
function pButton(i,j,label){var b=document.createElement('button');b.className='pcheck'+(done(i,'every',j)?' done':'');b.textContent=done(i,'every',j)?'✓':label;b.onclick=function(){set(i,'every',j,!done(i,'every',j));build()};return b}
function counts(i){var r=role(i),d=0,total=r.tasks.length+personals.length;r.tasks.forEach(function(_,j){if(done(i,'role',j))d++});personals.forEach(function(_,j){if(done(i,'every',j))d++});return[d,total]}
function build(){
 document.getElementById('day').textContent=now.toLocaleDateString(undefined,{weekday:'long'});
 document.getElementById('date').textContent=now.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});
 var c=document.getElementById('cards');c.innerHTML='';
 kids.forEach(function(k,i){var r=role(i),n=counts(i),pct=Math.round(n[0]/n[1]*100),card=document.createElement('section');card.className='card '+kidClass[i]+(n[0]===n[1]?' complete':'');card.innerHTML='<div class="cardtop"><div><div class="kidrow"><span class="kidicon">'+kidIcons[i]+'</span><div class="name">'+k+'</div></div><div class="role">'+r.name+'</div></div><div class="ring" style="--p:'+pct+'"><span>'+n[0]+'/'+n[1]+'</span></div></div>';var ts=document.createElement('div');ts.className='tasks';r.tasks.forEach(function(t,j){ts.appendChild(taskButton(i,j,t))});card.appendChild(ts);c.appendChild(card)});
 var p=document.getElementById('personal');p.innerHTML='';
 kids.forEach(function(k,i){var row=document.createElement('div');row.className='prow';row.innerHTML='<div class="pname">'+k+'</div>';var checks=document.createElement('div');checks.className='pchecks';personals.forEach(function(t,j){checks.appendChild(pButton(i,j,t))});row.appendChild(checks);p.appendChild(row)})
}
document.getElementById('settings').onclick=function(){document.getElementById('modal').style.display='flex'};
document.getElementById('cancel').onclick=function(){document.getElementById('modal').style.display='none'};
document.getElementById('reset').onclick=function(){kids.forEach(function(_,i){role(i).tasks.forEach(function(_,j){localStorage.removeItem(sk(i,'role',j))});personals.forEach(function(_,j){localStorage.removeItem(sk(i,'every',j))})});document.getElementById('modal').style.display='none';build()};
setInterval(function(){if(dk(new Date())!==key)location.reload()},60000);
build();
})();
</script>
</body>
</html>
