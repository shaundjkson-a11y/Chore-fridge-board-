<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Family Chores</title><style>:root{--pink:#ff4fb1;--blue:#20c9ff;--green:#41e97a;--good:#55e79d;--ink:#050c14}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#040a11;color:#fff;font-family:Arial,Helvetica,sans-serif}body{padding:8px;background:linear-gradient(rgba(3,9,16,.42),rgba(3,9,16,.72)),url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1600&q=82') center/cover fixed no-repeat}button{font:inherit}.app{height:100%;display:grid;grid-template-rows:118px 1fr 150px 72px;gap:9px}.top{position:relative;overflow:hidden;border-radius:20px;border:1px solid #284a64;background:linear-gradient(90deg,rgba(9,19,34,.8),rgba(9,34,52,.72));box-shadow:0 16px 34px rgba(0,0,0,.35)}.top:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(7,13,25,.15),rgba(7,13,25,.1)),url('https://images.unsplash.com/photo-1501785888041-af3ef285b470?auto=format&fit=crop&w=1600&q=82') center 48%/cover no-repeat;filter:saturate(1.25) contrast(1.05);opacity:.86}.top:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,12,20,.08),rgba(5,10,18,.36))}.topcontent{position:relative;z-index:2;height:100%;display:flex;align-items:flex-start;justify-content:space-between;padding:16px 18px}.brand{display:flex;align-items:flex-start;gap:13px}.logo{width:45px;height:36px;position:relative;margin-top:2px}.logo:before,.logo:after{content:"";position:absolute;top:0;width:14px;height:35px;border-radius:12px;transform:skew(-28deg);background:linear-gradient(#ff506d,#ff2d58)}.logo:before{left:5px}.logo:after{left:23px;opacity:.78}.title{font-size:35px;font-weight:900;letter-spacing:-1.2px}.tag{font-size:10px;letter-spacing:3.4px;color:#d3dfeb;margin-top:5px}.headRight{display:flex;gap orm:rotate(-3deg);text-shadow:0 0 10px color-mix(in srgb,var(--accent) 30%,transparent)}.every{border:1px solid #2b4c67;border-radius:20px;background:linear-gradient(180deg,rgba(12,31,48,.95),rgba(8,21,34,.96));padding:10px 12px;box-shadow:0 14px 28px rgba(0,0,0,.26)}.everyTop{height:36px;display:flex;align-items:center;justify-content:space-between}.everyTitle{display:flex;align-items:center;gap:10px}.sun{width:31px;height:31px}.everyTitle b{font-size:23px}.everySub{font-size:10px;letter-spacing:2px;color:#a1b4c8;margin-top:2px}.samehabits{font-family:cursive;font-size:14px;color:#d0dfec;transform:rotate(-4deg)}.basicsRow{height:45px;border-top:1px solid #27445e;border-bottom:1px solid #27445e;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;margin-bottom:8px}.basicItem{display:flex;align-items:center;justify-content:center;gap:7px;font-size:11px;color:#e3ebf2}.basicItem svg{width:21px;height:21px;stroke:#ff63b2;fill:none;stroke-width:2}.everyGrid{height:43px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.person{display:grid;grid-template-columns:80px 1fr;align-items:center;border-radius:11px;padding:5px 8px;border:1px solid #2d4d66;background:#10243a}.person:nth-child(1){background:linear-gradient(180deg,rgba(123,26,158,.86),rgba(52,17,80,.9));border-color:rgba(255,79,177,.6)}.person:nth-child(2){background:linear-gradient(180deg,rgba(0,102,156,.86),rgba(6,39,69,.92));border-color:rgba(32,201,255,.6)}.person:nth-child(3){background:linear-gradient(180deg,rgba(0,119,63,.86),rgba(7,51,34,.92));border-color:rgba(65,233,122,.6)}.pname{text-align:center;font-size:15px;font-weight:900}.all{height:31px;border-radius:16px;border:1px solid rgba(255,255,255,.42);background:rgba(4,12,20,.28);color:#fff;font-size:12px;font-weight:900;letter-spacing:.5px}.all.done{background:linear-gradient(#55e79d,#36c27d);color:#072518;border-color:#72efb0}.foot{position:relative;overflow:hidden;border-radius:16px;border:1px solid #1d3d56;background:linear-gradient(rgba(5,13,22,.25),rgba(5,13,22,.7)),url('https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?auto=format&fit=crop&w=1600&q=82') center 60%/cover no-repeat;padding:0 16px;display:flex;align-items:center;justify-content:space-between}.quote{font-size:10px;letter-spacing:1.5px;color:#b7c8d8;text-transform:uppercase;line-height:1.4}.quote:before{content:'“';font-size:44px;color:#8db7da;vertical-align:-10px;margin-right:7px}.signature{font-family:cursive;font-size:19px;color:#fff}.heart{color:#ff4d68}.modalbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:10;align-items:center;justify-content:center}.modal{width:380px;padding:20px;border:1px solid #36536e;border-radius:18px;background:#0d2032}.modal h2{margin-top:0}.modal p{color:#9db0c3}.actions{display:flex;justify-content:flex-end;gap:8px}.action{padding:10px 14px;border-radius:9px;border:1px solid #36536e;background:#173047;color:#fff}</style></head><body><div class="app"><header class="top"><div class="topcontent"><div class="brand"><div class="logo"></div><div><div class="title">Family Chores</div><div class="tag">A CLEANER HOME&nbsp;&nbsp; A HAPPIER FAMILY</div></div></div><div class="headRight"><div><div class="date"><b id="day"></b><span id="date"></span></div><div class="scribble">Small jobs<br>Big humans<br>Brighter tomorrows ♥</div></div><button class="gear" id="settings">⚙</button></div></div></header><main class="cards" id="cards"></main><section class="every"><div class="everyTop"><div><div class="everyTitle"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="#ffd43b"/><g stroke="#ffd43b" stroke-width="2"><path d="M12 1v3M12 20v3M1 12h3M20 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M19.8 4.2l-2.1 2.1M6.3 17.7l-2.1 2.1"/></g></svg><b>Every Day</b></div><div class="everySub">THE BASICS</div></div><div class="samehabits">Same habits<br>Brighter days ♥</div></div><div class="basicsRow"><div class="basicItem"><svg viewBox="0 0 24 24"><path d="M3 18V8h3v6h15 oom','sofa'],['Collect laundry & towels','shirt'],['Fold / put away washing if needed','washer']]}];function icon(n){var s={poo:'<path d="M8 17c-2-2-1-4 1-5-1-3 3-4 4-2 2-2 5 1 4 3 3 1 3 6 0 7H8z"/>',bowl:'<path d="M4 10h16c0 6-3 9-8 9s-8-3-8-9zM7 10c1-3 9-3 10 0"/>',bone:'<path d="M7 8l10 8M6 5a2 2 0 1 0 0 4l12 10a2 2 0 1 0 3-3L9 6a2 2 0 1 0-3-1z"/>',robot:'<rect x="5" y="8" width="14" height="10" rx="3"/><path d="M8 8V5h8v3M8 13h8M9 18v2M15 18v2"/>',leaf:'<path d="M5 19c8-1 13-6 14-14-8 1-13 6-14 14zM5 19l8-8"/>',dishwasher:'<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="13" r="4"/><path d="M8 6h1M11 6h5"/>',dishes:'<ellipse cx="12" cy="7" rx="6" ry="2"/><ellipse cx="12" cy="12" rx="6" ry="2"/><ellipse cx="12" cy="17" rx="6" ry="2"/>',table:'<path d="M4 9h16M6 9v10M18 9v10M8 9v4h8V9"/>',bin:'<path d="M6 7h12l-1 14H7L6 7zM9 7V4h6v3M4 7h16"/>',broom:'<path d="M15 3l-4 11M9 14l5 2-2 5-7-3 4-4z"/>',sofa:'<path d="M5 11V8c0-2 1-3 3-3h8c2 0 3 1 3 3v3M4 11h16c1 0 2 1 2 2v5H2v-5c0-1 1-2 2-2zM5 18v3M19 18v3"/>',shirt:'<path d="M8 5l4 2 4-2 4 4-3 3v8H7v-8L4 9z"/>',washer:'<rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="13" r="4"/><path d="M8 6h8"/>'}[n]||'<circle cx="12" cy="12" r="5"/>';return'<svg viewBox="0 0 24 24">'+s+'</svg>'}var anchor=new Date(2026,8,9,12);function pad(n){return n<10?'0'+n:n}function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function mod(n,m){return((n%m)+m)%m}function dd(a,b){return Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate(),12)-new Date(a.getFullYear(),a.getMonth(),a.getDate(),12))/86400000)}var now=new Date(),today=key(now),off=mod(dd(anchor,now),3);function role(i){return roles[mod(i+off,3)]}function sk(i,t,j){return'jackson-chores:'+today+':'+i+':'+t+':'+j}function done(i,t,j){return localStorage.getItem(sk(i,t,j))==='1'}function set(i,t,j,v){if(v)localStorage.setItem(sk(i,t,j),'1');else localStorage.removeItem(sk(i,t,j))}function basic(i){return done(i,'every','all')}function counts(i){var r=role(i),d=basic(i)?1:0;r.tasks.forEach(function(_,j){if(done(i,'role',j))d++});return[d,r.tasks.length+1]}function task(i,j,t){var b=document.createElement('button');b.className='task'+(done(i,'role',j)?' done':'');b.innerHTML='<span class="box">'+(done(i,'role',j)?'✓':'')+'</span><span class="ico">'+icon(t[1])+'</span><span class="label">'+t[0]+'</span><span class="arrow">›</span>';b.onclick=function(){set(i,'role',j,!done(i,'role',j));build()};return b}function build(){document.getElementById('day').textContent=now.toLocaleDateString(undefined,{weekday:'long'});document.getElementById('date').textContent=now.toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});var c=document.getElementById('cards');c.innerHTML='';kids.forEach(function(k,i){var r=role(i),n=counts(i),pct=Math.round(n[0]/n[1]*100),card=document.createElement('section');card.className='card '+cls[i];card.innerHTML='<div class="hero"><div class="heroContent"><div class="roleicon">'+roleIcons[i]+'</div><div class="name">'+k+'</div><div class="role">'+r.name+'</div><div class="ring" style="--p:'+pct+'"><span>'+n[0]+'/'+n[1]+'</span></div></div></div>';var ts=document.createElement('div');ts.className='tasks';r.tasks.forEach(function(t,j){ts.appendChild(task(i,j,t))});card.appendChild(ts);var ch=document.createElement('div');ch.className='cheer';ch.textContent=cheer[i]+' ♥';card.appendChild(ch);c.appendChild(card)});var e=document.getElementById('every');e.innerHTML='';kids.forEach(function(k,i){var p=document.createElement('div');p.className='person';p.innerHTML='<div class="pname">'+k+'</div>';var b=document.createElement('button');b.className='all'+(basic(i)?' done':'');b.textContent=basic(i)?'✓ ALL DONE':'ALL DONE';b.onclick=function(){set(i,'every','all',!basic(i));build()};p.appendChild(b);e.appendChild(p)})}document.getElementById('settings').onclick=function(){document.getElementById('modal').style.display='flex'};document.getElementById('cancel').onclick=function(){document.getElementById('modal').style.display='none'};document.getElementById('reset').onclick=function(){kids.forEach(function(_,i){role(i).tasks.forEach(function(_,j){localStorage.removeItem(sk(i,'role',j))});localStorage.removeItem(sk(i,'every','all'))});document.getElementById('modal').style.display='none';build()};setInterval(function(){if(key(new Date())!==today)location.reload()},60000);build()})();</script></body></html>
