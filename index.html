<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d0f12"><title>Jackson Chore Board</title><style>:root{--bg:#0d0f12;--panel:#171a1f;--tile:#20242a;--line:#303741;--text:#f5f7f9;--muted:#9da6b1;--blue:#78a2ff;--green:#35b875}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}body{padding:12px}.app{max-width:1080px;margin:auto}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.head h1{font-size:28px;margin:0}.date{text-align:right;color:var(--muted);font-size:15px}.date b{display:block;color:var(--text);font-size:18px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:12px}.card.complete{border-color:var(--green)}.cardtop{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:9px}.name{font-size:25px;font-weight:900}.role{color:var(--blue);font-weight:800;font-size:15px;margin-top:2px}.score{font-size:14px;color:var(--muted)}.tasks{display:grid;gap:6px}.task{border:1px solid var(--line);background:var(--tile);color:var(--text);border-radius:11px;padding:8px 9px;min-height:43px;display:flex;align-items:center;gap:8px;text-align:left;width:100%;font-size:15px;line-height:1.15}.box{width:23px;height:23px;border:2px solid #6d7783;border-radius:6px;flex:0 0 23px;display:grid;place-items:center;font-weight:bold}.task.done{background:rgba(53,184,117,.15);border-color:rgba(53,184,117,.65)}.task.done .box{background:var(--green);border-color:var(--green)}.task.done .label{text-decoration:line-through}.personal{margin-top:10px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 12px}.ptitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}.ptitle b{font-size:17px}.ptitle span{font-size:12px;color:var(--muted)}.personalgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.prow{border-right:1px solid var(--line);padding-right:9px}.prow:last-child{border:0;padding-right:0}.pname{font-size:17px;font-weight:800;margin-bottom:5px}.pchecks{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.pcheck{border:1px solid var(--line);background:var(--tile);color:var(--text);border-radius:8px;height:39px;font-size:11px;display:grid;place-items:center;text-align:center;padding:2px}.pcheck.done{background:var(--green);border-color:var(--green);color:white}.legend{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px;color:var(--muted);font-size:10px;text-align:center}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:8px;color:var(--muted);font-size:11px}.settings{border:0;background:transparent;color:#707985;font-size:20px;padding:4px 8px}.modalbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.75);align-items:center;justify-content:center;padding:20px}.modal{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px;max-width:420px}.modal h2{margin-top:0}.modalbuttons{display:flex;justify-content:flex-end;gap:8px}.action{border:1px solid var(--line);background:var(--tile);color:var(--text);padding:10px 14px;border-radius:10px}@media(max-width:700px){body{padding:9px}.head h1{font-size:23px}.cards{grid-template-columns:1fr}.card{padding:10px}.tasks{grid-template-columns:repeat(2,1fr)}.task{min-height:48px}.personalgrid{grid-template-columns:1fr}.prow{border-right:0;border-bottom:1px solid var(--line);padding:0 0 7px}.prow:last-child{border-bottom:0}.legend{display:none}}@media(min-width:701px) and (orientation:portrait){html,body{height:100%;overflow:hidden}.app{height:100vh;display:flex;flex-direction:column}.cards{flex:1;min-height:0}.card{display:flex;flex-direction:column}.tasks{flex:1}.task{min-height:0}.personal{margin-top:8px}.head{margin-bottom:8px}}</style></head><body><div class="app"><header class="head"><h1>Jackson Chores</h1><div class="date"><b id="day"></b><span id="date"></span></div></header><main class="cards" id="cards"></main><section class="personal"><div class="ptitle"><b>Every day</b><span>Tap each box when done</span></div><div class="personalgrid" id="personal"></div><div class="legend"><span>Bed</span><span>Clothes</span><span>Dishes</span><span>Floor</span><span>Rubbish</span></div></section><footer class="foot"><span>Roles rotate automatically each day</span><button class="settings" id="settings">⚙</button></footer></div><div class="modalbg" id="modal"><div class="modal"><h2>Reset today?</h2><p>Clear all of today's ticks?</p><div class="modalbuttons"><button class="action" id="cancel">Cancel</button><button class="action" id="reset">Reset</button></div></div></div><script>(function(){var kids=['Indie','Lola','Gideon'];var roles=[{name:'Dogs & Outside',tasks:['Pick up dog poo','Clean & refill dog water','Feed the dogs','Pool robot + clean filter','Quick outdoor tidy']},{name:'Kitchen',tasks:['Unload dishwasher','Clear / load dinner dishes','Wipe table & benches','Rubbish & recycling']},{name:'House',tasks:['Vacuum / sweep main area','Reset lounge room','Collect laundry & towels','Fold / put away washing if needed']}];var personals=['Bed','Clothes','Dishes','Floor','Rubbish'];var anchor=new Date(2026,8,9,12);function pad(n){return n<10?'0'+n:n}function dk(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function diff(a,b){return Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate(),12)-new Date(a.getFullYear(),a.getMonth(),a.getDate(),12))/86400000)}function mod(n,m){return((n%m)+m)%m}var now=new Date(),key=dk(now),off=mod(diff(anchor,now),3);function role(i){return roles[mod(i+off,3)]}function sk(i,t,j){return'jackson-chores:'+key+':'+i+':'+t+':'+j}function done(i,t,j){return localStorage.getItem(sk(i,t,j))==='1'}function set(i,t,j,v){if(v)localStorage.setItem(sk(i,t,j),'1');else localStorage.removeItem(sk(i,t,j))}function button(i,t,j,label,small){var b=document.createElement('button');b.className=(small?'pcheck':'task')+(done(i,t,j)?' done':'');if(small)b.textContent=done(i,t,j)?'✓':label;else b.innerHTML='<span class="box">'+(done(i,t,j)?'✓':'')+'</span><span class="label">'+label+'</span>';b.onclick=function(){set(i,t,j,!done(i,t,j));build()};return b}function counts(i){var r=role(i),d=0,total=r.tasks.length+personals.length;r.tasks.forEach(function(_,j){if(done(i,'role',j))d++});personals.forEach(function(_,j){if(done(i,'every',j))d++});return[d,total]}function build(){document.getElementById('day').textContent=now.toLocaleDateString(undefined,{weekday:'long'});document.getElementById('date').textContent=now.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});var c=document.getElementById('cards');c.innerHTML='';kids.forEach(function(k,i){var r=role(i),n=counts(i),card=document.createElement('section');card.className='card'+(n[0]===n[1]?' complete':'');card.innerHTML='<div class="cardtop"><div><div class="name">'+k+'</div><div class="role">'+r.name+'</div></div><div class="score">'+n[0]+' / '+n[1]+'</div></div>';var ts=document.createElement('div');ts.className='tasks';r.tasks.forEach(function(t,j){ts.appendChild(button(i,'role',j,t,false))});card.appendChild(ts);c.appendChild(card)});var p=document.getElementById('personal');p.innerHTML='';kids.forEach(function(k,i){var row=document.createElement('div');row.className='prow';row.innerHTML='<div class="pname">'+k+'</div>';var checks=document.createElement('div');checks.className='pchecks';personals.forEach(function(t,j){checks.appendChild(button(i,'every',j,t,true))});row.appendChild(checks);p.appendChild(row)})}document.getElementById('settings').onclick=function(){document.getElementById('modal').style.display='flex'};document.getElementById('cancel').onclick=function(){document.getElementById('modal').style.display='none'};document.getElementById('reset').onclick=function(){kids.forEach(function(_,i){role(i).tasks.forEach(function(_,j){localStorage.removeItem(sk(i,'role',j))});personals.forEach(function(_,j){localStorage.removeItem(sk(i,'every',j))})});document.getElementById('modal').style.display='none';build()};setInterval(function(){if(dk(new Date())!==key)location.reload()},60000);build()})();</script></body></html>
