<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111214">
<title>Jackson Chore Board</title>
<style>
  :root {
    --bg:#0f1114;
    --panel:#171a1f;
    --panel2:#1d2127;
    --text:#f4f6f8;
    --muted:#9ea6b0;
    --line:#2b3139;
    --good:#2fb36f;
    --warn:#f0a734;
    --accent:#7aa2ff;
    --danger:#d95c5c;
    --shadow:0 14px 40px rgba(0,0,0,.28);
    --radius:24px;
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; min-height:100%; background:var(--bg); color:var(--text); font-family:Arial,Helvetica,sans-serif; }
  body { padding:20px; }
  button { font:inherit; }
  .shell { max-width:1180px; margin:0 auto; }
  .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:18px; }
  .titleblock h1 { margin:0; font-size:38px; letter-spacing:-.6px; }
  .titleblock .sub { color:var(--muted); margin-top:6px; font-size:19px; }
  .datebox { text-align:right; background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:12px 16px; min-width:230px; }
  .datebox .day { font-size:22px; font-weight:700; }
  .datebox .date { color:var(--muted); font-size:16px; margin-top:3px; }
  .summary { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:16px; }
  .summaryCard { background:var(--panel); border:1px solid var(--line); border-radius:18px; padding:12px 14px; display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .summaryCard .name { font-size:20px; font-weight:800; }
  .summaryCard .status { color:var(--muted); font-size:16px; }
  .summaryCard.done { border-color:rgba(47,179,111,.55); box-shadow:inset 0 0 0 1px rgba(47,179,111,.12); }
  .summaryCard.done .status { color:#86e6b3; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:14px; }
  .kid { background:var(--panel); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow); }
  .kidHead { padding:18px 18px 14px; border-bottom:1px solid var(--line); background:linear-gradient(180deg, rgba(255,255,255,.035), rgba(255,255,255,0)); }
  .kidName { font-size:31px; font-weight:900; letter-spacing:.2px; }
  .role { margin-top:7px; font-size:18px; color:var(--accent); font-weight:800; }
  .progress { height:8px; margin-top:13px; background:#0c0e11; border-radius:999px; overflow:hidden; }
  .bar { height:100%; width:0%; background:var(--good); transition:width .2s ease; }
  .sectionTitle { padding:13px 16px 7px; color:var(--muted); font-size:13px; font-weight:800; letter-spacing:1px; text-transform:uppercase; }
  .task { width:calc(100% - 20px); margin:0 10px 9px; min-height:62px; display:flex; align-items:center; gap:12px; background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:16px; padding:12px 13px; text-align:left; cursor:pointer; }
  .task:active { transform:scale(.992); }
  .check { width:28px; height:28px; border:2px solid #66707c; border-radius:8px; flex:0 0 28px; display:grid; place-items:center; font-size:20px; font-weight:900; }
  .task .label { font-size:18px; line-height:1.16; }
  .task.done { background:rgba(47,179,111,.14); border-color:rgba(47,179,111,.6); }
  .task.done .check { background:var(--good); border-color:var(--good); color:white; }
  .task.done .label { color:#e8fff2; text-decoration:line-through; text-decoration-thickness:1px; }
  .bottom { display:flex; justify-content:space-between; gap:12px; margin-top:16px; align-items:center; }
  .hint { color:var(--muted); font-size:15px; line-height:1.35; }
  .actions { display:flex; gap:8px; }
  .action { border:1px solid var(--line); background:var(--panel); color:var(--text); border-radius:14px; padding:11px 14px; cursor:pointer; font-weight:700; }
  .action.danger { color:#ffb1b1; }
  .modalBackdrop { display:none; position:fixed; inset:0; background:rgba(0,0,0,.72); align-items:center; justify-content:center; padding:20px; z-index:10; }
  .modal { width:min(520px, 100%); background:var(--panel); border:1px solid var(--line); border-radius:22px; padding:20px; }
  .modal h2 { margin:0 0 10px; font-size:26px; }
  .modal p { color:var(--muted); line-height:1.45; }
  .modalButtons { display:flex; justify-content:flex-end; gap:10px; margin-top:18px; }
  @media (max-width:900px) {
    body { padding:14px; }
    .grid { grid-template-columns:1fr; }
    .summary { grid-template-columns:1fr; }
    .topbar { align-items:flex-start; }
    .titleblock h1 { font-size:32px; }
    .datebox { min-width:auto; }
  }
  @media (orientation:portrait) and (min-width:700px) {
    .grid { grid-template-columns:1fr; }
    .kidHead { display:grid; grid-template-columns:1fr auto; align-items:end; gap:8px 18px; }
    .kidHead .progress { grid-column:1 / -1; }
    .task .label { font-size:22px; }
    .task { min-height:72px; }
    .sectionTitle { font-size:15px; }
  }
</style>
</head>
<body>
<div class="shell">
  <div class="topbar">
    <div class="titleblock">
      <h1>Jackson Chore Board</h1>
      <div class="sub">Do your bit. Tick it when it is actually done.</div>
    </div>
    <div class="datebox">
      <div class="day" id="dayText"></div>
      <div class="date" id="dateText"></div>
    </div>
  </div>
  <div class="summary" id="summary"></div>
  <div class="grid" id="board"></div>
  <div class="bottom">
    <div class="hint">Jobs rotate automatically each day. The board resets for the new day, while older days stay saved on this fridge.</div>
    <div class="actions">
      <button class="action" id="refreshBtn">Refresh</button>
      <button class="action danger" id="resetBtn">Reset today</button>
    </div>
  </div>
</div>
<div class="modalBackdrop" id="modalBackdrop">
  <div class="modal">
    <h2>Reset today's ticks?</h2>
    <p>This only clears the check marks for today. It does not change the rotation.</p>
    <div class="modalButtons">
      <button class="action" id="cancelReset">Cancel</button>
      <button class="action danger" id="confirmReset">Reset</button>
    </div>
  </div>
</div>
<script>
(function(){
  "use strict";
  var kids = ["Indie","Lola","Gideon"];
  var roles = [
    { name:"Dogs & Outside", tasks:["Pick up dog poo","Empty, rinse & refill dog water","Feed the dogs","Remove pool robot & clean basket/filter","Quick pool / outdoor tidy"] },
    { name:"Kitchen", tasks:["Unload dishwasher","Clear / load dinner dishes","Wipe dining table & kitchen benches","Check rubbish & recycling"] },
    { name:"House", tasks:["Quick vacuum / sweep of main area","Reset lounge room","Collect laundry & towels","Fold or put away one washing basket if needed"] }
  ];
  var everyoneTasks = ["Make bed","Dirty clothes in hamper","Dishes / cups back to kitchen","Bedroom floor reasonably clear","Bedroom rubbish removed"];
  var anchor = new Date(2026, 8, 9, 12, 0, 0);
  function pad(n){ return n < 10 ? "0"+n : ""+n; }
  function dateKey(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
  function dayDiff(a,b){ var aa = new Date(a.getFullYear(),a.getMonth(),a.getDate(),12,0,0); var bb = new Date(b.getFullYear(),b.getMonth(),b.getDate(),12,0,0); return Math.round((bb-aa)/86400000); }
  function mod(n,m){ return ((n%m)+m)%m; }
  var today = new Date();
  var key = dateKey(today);
  var rotationOffset = mod(dayDiff(anchor,today), 3);
  function roleForKid(kidIndex){ return roles[mod(kidIndex + rotationOffset, 3)]; }
  function storageKey(kidIndex, taskType, taskIndex){ return "jackson-chores:"+key+":"+kidIndex+":"+taskType+":"+taskIndex; }
  function getDone(kidIndex, taskType, taskIndex){ return localStorage.getItem(storageKey(kidIndex,taskType,taskIndex)) === "1"; }
  function setDone(kidIndex, taskType, taskIndex, done){ var k = storageKey(kidIndex,taskType,taskIndex); if(done) localStorage.setItem(k,"1"); else localStorage.removeItem(k); }
  function makeTask(kidIndex, taskType, taskIndex, label){
    var btn = document.createElement("button");
    btn.className = "task" + (getDone(kidIndex,taskType,taskIndex) ? " done" : "");
    btn.setAttribute("type","button");
    var check = document.createElement("span"); check.className = "check"; check.textContent = getDone(kidIndex,taskType,taskIndex) ? "✓" : "";
    var text = document.createElement("span"); text.className = "label"; text.textContent = label;
    btn.appendChild(check); btn.appendChild(text);
    btn.onclick = function(){ var nowDone = !btn.classList.contains("done"); setDone(kidIndex,taskType,taskIndex,nowDone); btn.classList.toggle("done",nowDone); check.textContent = nowDone ? "✓" : ""; updateProgress(); };
    return btn;
  }
  function build(){
    document.getElementById("dayText").textContent = today.toLocaleDateString(undefined,{weekday:"long"});
    document.getElementById("dateText").textContent = today.toLocaleDateString(undefined,{day:"numeric",month:"long",year:"numeric"});
    var board = document.getElementById("board"); board.innerHTML = "";
    kids.forEach(function(kid,kidIndex){
      var role = roleForKid(kidIndex);
      var card = document.createElement("section"); card.className = "kid"; card.setAttribute("data-kid",kidIndex);
      var head = document.createElement("div"); head.className = "kidHead";
      head.innerHTML = '<div><div class="kidName">'+kid+'</div><div class="role">'+role.name+'</div></div><div class="progress"><div class="bar" id="bar-'+kidIndex+'"></div></div>';
      card.appendChild(head);
      var st1 = document.createElement("div"); st1.className = "sectionTitle"; st1.textContent = "Rotating jobs"; card.appendChild(st1);
      role.tasks.forEach(function(t,i){ card.appendChild(makeTask(kidIndex,"role",i,t)); });
      var st2 = document.createElement("div"); st2.className = "sectionTitle"; st2.textContent = "Every day"; card.appendChild(st2);
      everyoneTasks.forEach(function(t,i){ card.appendChild(makeTask(kidIndex,"every",i,t)); });
      board.appendChild(card);
    });
    updateProgress();
  }
  function counts(kidIndex){ var role = roleForKid(kidIndex); var total = role.tasks.length + everyoneTasks.length; var done = 0; role.tasks.forEach(function(_,i){ if(getDone(kidIndex,"role",i)) done++; }); everyoneTasks.forEach(function(_,i){ if(getDone(kidIndex,"every",i)) done++; }); return {done:done,total:total}; }
  function updateProgress(){
    var summary = document.getElementById("summary"); summary.innerHTML = "";
    kids.forEach(function(kid,kidIndex){
      var c = counts(kidIndex); var pct = Math.round((c.done/c.total)*100); var bar = document.getElementById("bar-"+kidIndex); if(bar) bar.style.width = pct+"%";
      var s = document.createElement("div"); s.className = "summaryCard" + (c.done === c.total ? " done" : "");
      s.innerHTML = '<div class="name">'+kid+'</div><div class="status">'+(c.done === c.total ? "Done ✓" : c.done+" / "+c.total)+'</div>'; summary.appendChild(s);
    });
  }
  document.getElementById("refreshBtn").onclick = function(){ location.reload(); };
  document.getElementById("resetBtn").onclick = function(){ document.getElementById("modalBackdrop").style.display = "flex"; };
  document.getElementById("cancelReset").onclick = function(){ document.getElementById("modalBackdrop").style.display = "none"; };
  document.getElementById("confirmReset").onclick = function(){
    kids.forEach(function(_,kidIndex){ var role = roleForKid(kidIndex); role.tasks.forEach(function(_,i){ localStorage.removeItem(storageKey(kidIndex,"role",i)); }); everyoneTasks.forEach(function(_,i){ localStorage.removeItem(storageKey(kidIndex,"every",i)); }); });
    document.getElementById("modalBackdrop").style.display = "none"; build();
  };
  var initialKey = key;
  setInterval(function(){ var nowKey = dateKey(new Date()); if(nowKey !== initialKey) location.reload(); }, 60000);
  build();
})();
</script>
</body>
</html>
