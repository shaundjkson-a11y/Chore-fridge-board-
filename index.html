<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Jackson Chores</title><style>:root{--pink:#ff58ae;--blue:#25c8ff;--green:#4be77f;--ink:#07111d;--card:#0d1d2c;--tile:#13273a;--line:#29435d;--muted:#93a9be}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101a;color:#fff;font-family:Arial,sans-serif}body{padding:10px;background:radial-gradient(circle at 15% 5%,#27112c 0,transparent 23%),radial-gradient(circle at 52% 5%,#062d43 0,transparent 25%),radial-gradient(circle at 88% 6%,#073925 0,transparent 24%),linear-gradient(#06111c,#071521)}button{font:inherit}.app{height:100%;display:grid;grid-template-rows:68px minmax(0,1fr) 92px 24px;gap:9px}.top{display:flex;align-items:center;justify-content:space-between;padding:0 8px}.brand{display:flex;align-items:center;gap:12px}.logo{width:40px;height:32px;position:relative}.logo:before,.logo:after{content:"";position:absolute;width:13px;height:31px;border-radius:12px;transform:rotate(35deg);background:linear-gradient(#ff526d,#ff2d58)}.logo:before{left:5px}.logo:after{left:22px;opacity:.72}.title{font-size:31px;font-weight:900;letter-spacing:-1px}.tag{font-size:9px;letter-spacing:3.5px;color:#9eb3c9;margin-top:3px}.right{display:flex;gap:12px;align-items:center}.date{text-align:right;font-size:13px;color:#a5b6c8}.date b{display:block;font-size:19px;color:#fff}.gear{width:42px;height:42px;border:1px solid #3b5973;border-radius:13px;background:#102235;color:#dce8f2;font-size:20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;min-height:0}.card{--accent:#fff;display:grid;grid-template-rows:112px minmax(0,1fr) 34px;min-height:0;position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--accent);background:linear-gradient(180deg,rgba(14,30,45,.98),rgba(6,17,28,.98));box-shadow:0 15px 35px rgba(0,0,0,.28)}.indie{--accent:var(--pink)}.lola{--accent:var(--blue)}.gideon{--accent:var(--green)}.hero{position:relative;padding:14px 14px 8px;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--accent) 44%,#0b1725),#0b2437 62%,#081520)}.hero:before{content:"";position:absolute;inset:0;opacity:.28;background:linear-gradient(155deg,transparent 38%,rgba(255,255,255,.10) 39%,transparent 41%),linear-gradient(25deg,transparent 55%,rgba(0,0,0,.55) 56%);clip-path:polygon(0 0,100% 0,100% 100%,0 100%)}.mountains{position:absolute;left:0;right:0;bottom:-1px;height:42px;opacity:.42;background:linear-gradient(145deg,transparent 25%,#020910 26% 43%,transparent 44%),linear-gradient(215deg,transparent 35%,#020910 36% 55%,transparent 56%)}.heroTop{position:relative;display:flex;justify-content:space-between;z-index:1}.who{display:flex;align-items:center;gap:9px}.roleicon{width:34px;height:34px;border:2px solid var(--accent);border-radius:10px;display:grid;place-items:center;color:var(--accent);font-size:19px;font-weight:900}.name{font-size:28px;font-weight:900;letter-spacing:-.6px}.role{position:relative;z-index:1;margin-top:6px;font-size:13px;font-weight:900;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),rgba(255,255,255,.13) 0);display:grid;place-items:center;position:relative}.ring:after{content:"";position:absolute;width:42px;height:42px;border-radius:50%;background:#0b1927}.ring span{z-index:1;font-size:12px;font-weight:900}.tasks{display:grid;gap:7px;padding:9px 10px;min-height:0}.task{min-height:0;width:100%;display:grid;grid-template-columns:25px 34px 1fr;align-items:center;gap:8px;text-align:left;border:1px solid rgba(139,169,198,.22);border-radius:13px;background:linear-gradient(#142a3e,#102337);color:#f7fbff;padding:6px 8px;font-size:14px;line-height:1.12}.box{width:24px;height:24px;border:2px solid #758ba0;border-radius:6px;display:grid;place-items:center;font-weight:900}.ico{width:32px;height:32px;border-radius:9px;background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent);display:grid;place-items:center;font-size:17px;font-weight:900}.task.done{background:linear-gradient(#1d5e46,#174332);border-color:#42d98a}.task.done .box{background:#43dc8d;border-color:#43dc8d;color:#062417}.task.done .label{text-decoration:line-through}.cheer{display:grid;place-items:center;color:var(--accent);font-size:13px;font-style:italic;font-weight:700;opacity:.88}.every{border:1px solid #29465f;border-radius:18px;background:linear-gradient(180deg,#0f2235,#0a1928);padding:8px 12px}.everyTop{height:23px;display:flex;align-items:center;justify-content:space-between}.everyTop b{font-size:18px}.everyTop span{font-size:10px;color:#9eb0c2}.everyGrid{height:52px;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding-top:5px}.person{display:grid;grid-template-columns:90px 1fr;align-items:center;padding-right:9px;border-right:1px solid #253e55}.person:last-child{border:0;padding:0}.pname{font-size:16px;font-weight:900}.basics{font-size:8px;color:#8da2b6;margin-top:2px}.all{height:42px;border-radius:10px;border:1px solid #35536c;background:#152b40;color:#eaf3fa;font-size:12px;font-weight:900;letter-spacing:.5px}.person:nth-child(1) .all{border-color:rgba(255,88,174,.45)}.person:nth-child(2) .all{border-color:rgba(37,200,255,.45)}.person:nth-child(3) .all{border-color:rgba(75,231,127,.45)}.all.done{background:linear-gradient(#51e69a,#2fbe75);border-color:#64eca8;color:#062417}.foot{display:flex;justify-content:space-between;align-items:center;padding:0 5px;font-size:9px;letter-spacing:1.5px;color:#71869b;text-transform:uppercase}.heart{color:#ff4663}.modalbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:10;align-items:center;justify-content:center}.modal{width:380px;padding:20px;border:1px solid #36536e;border-radius:18px;background:#0d2032}.modal h2{margin-top:0}.modal p{color:#9db0c3}.actions{display:flex;justify-content:flex-end;gap:8px}.action{padding:10px 14px;border-radius:9px;border:1px solid #36536e;background:#173047;color:#fff}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo"></div><div><div class="title">Jackson Chores</div><div class="tag">A CLEANER HOME&nbsp;&nbsp; A HAPPIER FAMILY</div></div></div><div class="right"><div class="date"><b id="day"></b><span id="date"></span></div><button class="gear" id="settings">⚙</button></div></header><main class="cards" id="cards"></main><section class="every"><div class="everyTop"><b>Every Day <small style="font-size:9px;color:#8ea4b8;letter-spacing:2px">THE BASICS</small></b><span>Bed • Clothes • Dishes • Floor • Rubbish</span></div><div class="everyGrid" id="every"></div></section><footer class="foot"><span>Consistency today creates freedom tomorrow</span><span>Jackson Family <span class="heart">♥</span></span></footer></div><div class="modalbg" id="modal"><div class="modal"><h2>Reset today?</h2><p>Clear every completed job for today?</p><div class="actions"><button class="action" id="cancel">Cancel</button><button class="action" id="reset">Reset</button></div></div></div><script>(function(){var kids=['Indie','Lola','Gideon'],cls=['indie','lola','gideon'],glyph=['P','K','H'],cheer=['Good work, Indie!','You’ve got this!','Legend!'];var roles=[{name:'Dogs & Outside',tasks:[['Pick up dog poo','●'],['Clean & refill dog water','○'],['Feed the dogs','B'],['Pool robot + clean filter','R'],['Quick outdoor tidy','✦']]},{name:'Kitchen',tasks:[['Unload dishwasher','D'],['Clear / load dinner dishes','O'],['Wipe table & benches','T'],['Rubbish & recycling','♻']]},{name:'House',tasks:[['Vacuum / sweep main area','V'],['Reset lounge room','L'],['Collect laundry & towels','W'],['Fold / put away washing if needed','F']]}];var anchor=new Date(2026,8,9,12);function pad(n){return n<10?'0'+n:n}function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function mod(n,m){return((n%m)+m)%m}function dd(a,b){return Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate(),12)-new Date(a.getFullYear(),a.getMonth(),a.getDate(),12))/86400000)}var now=new Date(),today=key(now),off=mod(dd(anchor,now),3);function role(i){return roles[mod(i+off,3)]}function sk(i,t,j){return'jackson-chores:'+today+':'+i+':'+t+':'+j}function done(i,t,j){return localStorage.getItem(sk(i,t,j))==='1'}function set(i,t,j,v){if(v)localStorage.setItem(sk(i,t,j),'1');else localStorage.removeItem(sk(i,t,j))}function basic(i){return done(i,'every','all')}function counts(i){var r=role(i),d=basic(i)?1:0;r.tasks.forEach(function(_,j){if(done(i,'role',j))d++});return[d,r.tasks.length+1]}function task(i,j,t){var b=document.createElement('button');b.className='task'+(done(i,'role',j)?' done':'');b.innerHTML='<span class="box">'+(done(i,'role',j)?'✓':'')+'</span><span class="ico">'+t[1]+'</span><span class="label">'+t[0]+'</span>';b.onclick=function(){set(i,'role',j,!done(i,'role',j));build()};return b}function build(){document.getElementById('day').textContent=now.toLocaleDateString(undefined,{weekday:'long'});document.getElementById('date').textContent=now.toLocaleDateString(undefined,{day:'numeric',month:'short',year:'numeric'});var c=document.getElementById('cards');c.innerHTML='';kids.forEach(function(k,i){var r=role(i),n=counts(i),pct=Math.round(n[0]/n[1]*100),card=document.createElement('section');card.className='card '+cls[i];card.innerHTML='<div class="hero"><div class="mountains"></div><div class="heroTop"><div><div class="who"><span class="roleicon">'+glyph[i]+'</span><span class="name">'+k+'</span></div><div class="role">'+r.name+'</div></div><div class="ring" style="--p:'+pct+'"><span>'+n[0]+'/'+n[1]+'</span></div></div></div>';var ts=document.createElement('div');ts.className='tasks';ts.style.gridTemplateRows='repeat('+r.tasks.length+',1fr)';r.tasks.forEach(function(t,j){ts.appendChild(task(i,j,t))});card.appendChild(ts);var ch=document.createElement('div');ch.className='cheer';ch.textContent=cheer[i];card.appendChild(ch);c.appendChild(card)});var e=document.getElementById('every');e.innerHTML='';kids.forEach(function(k,i){var p=document.createElement('div');p.className='person';p.innerHTML='<div><div class="pname">'+k+'</div><div class="basics">5 everyday basics</div></div>';var b=document.createElement('button');b.className='all'+(basic(i)?' done':'');b.textContent=basic(i)?'✓ ALL DONE':'ALL DONE';b.onclick=function(){set(i,'every','all',!basic(i));build()};p.appendChild(b);e.appendChild(p)})}document.getElementById('settings').onclick=function(){document.getElementById('modal').style.display='flex'};document.getElementById('cancel').onclick=function(){document.getElementById('modal').style.display='none'};document.getElementById('reset').onclick=function(){kids.forEach(function(_,i){role(i).tasks.forEach(function(_,j){localStorage.removeItem(sk(i,'role',j))});localStorage.removeItem(sk(i,'every','all'))});document.getElementById('modal').style.display='none';build()};setInterval(function(){if(key(new Date())!==today)location.reload()},60000);build()})();</script></body></html>
