<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Family Chores</title><style>:root{--pink:#ff58ae;--pink2:#7a27df;--blue:#25c8ff;--blue2:#0968d6;--green:#4be77f;--green2:#098a57;--good:#4ce29a}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#06101a;color:#fff;font-family:Arial,Helvetica,sans-serif}body{padding:9px;background:linear-gradient(180deg,#06101a 0%,#071522 100%)}button{font:inherit}.app{height:100%;display:grid;grid-template-rows:72px minmax(0,1fr) 114px 28px;gap:8px}.top{display:flex;align-items:center;justify-content:space-between;padding:0 7px;border:1px solid #1c3851;border-radius:18px;background:linear-gradient(90deg,#101b31 0%,#0c2334 58%,#0c2a28 100%);box-shadow:0 10px 30px rgba(0,0,0,.28)}.brand{display:flex;align-items:center;gap:12px}.logo{width:42px;height:31px;position:relative}.logo:before,.logo:after{content:"";position:absolute;top:0;width:13px;height:31px;border-radius:12px;transform:skew(-28deg);background:linear-gradient(180deg,#ff4a66,#ff3159)}.logo:before{left:5px}.logo:after{left:22px;opacity:.78}.title{font-size:31px;font-weight:900;letter-spacing:-1px}.tag{font-size:9px;letter-spacing:3.3px;color:#9eb3c9;margin-top:3px}.right{display:flex;gap:11px;align-items:center}.date{text-align:right;font-size:13px;color:#a8b8c8;line-height:1.15}.date b{display:block;font-size:19px;color:#fff}.gear{width:42px;height:42px;border:1px solid #42617b;border-radius:13px;background:#102438;color:#d9e7f2;font-size:20px}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;min-height:0}.card{--accent:#fff;--accent2:#555;display:grid;grid-template-rows:142px minmax(0,1fr) 38px;min-height:0;position:relative;overflow:hidden;border-radius:22px;border:1px solid var(--accent);background:linear-gradient(180deg,#0c1c2a 0%,#07131f 100%);box-shadow:0 16px 36px rgba(0,0,0,.32)}.indie{--accent:var(--pink);--accent2:var(--pink2)}.lola{--accent:var(--blue);--accent2:var(--blue2)}.gideon{--accent:var(--green);--accent2:var(--green2)}.hero{position:relative;overflow:hidden;padding:12px 13px;background:linear-gradient(150deg,var(--accent2),#0b2437 65%,#081520)}.scene{position:absolute;inset:0;width:100%;height:100%;opacity:.72}.heroShade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(3,8,16,.06),rgba(4,11,18,.18) 50%,rgba(5,12,19,.72) 100%)}.heroTop{position:relative;z-index:2;display:flex;justify-content:space-between;align-items:flex-start}.who{display:flex;align-items:center;gap:9px}.roleicon{width:38px;height:38px;color:var(--accent);filter:drop-shadow(0 0 8px rgba(255,255,255,.08))}.name{font-size:29px;font-weight:900;letter-spacing:-.6px}.role{position:relative;z-index:2;margin-top:6px;font-size:13px;font-weight:900;color:var(--accent);text-transform:uppercase;letter-spacing:.5px}.ring{--p:0;width:60px;height:60px;border-radius:50%;background:conic-gradient(var(--accent) calc(var(--p)*1%),rgba(255,255,255,.14) 0);display:grid;place-items:center;position:relative;box-shadow:0 0 18px rgba(255,255,255,.04)}.ring:after{content:"";position:absolute;width:43px;height:43px;border-radius:50%;background:#081522}.ring span{z-index:1;font-size:12px;font-weight:900}.tasks{display:grid;gap:6px;padding:8px 9px;min-height:0}.task{min-height:0;width:100%;display:grid;grid-template-columns:25px 36px 1fr;align-items:center;gap:8px;text-align:left;border:1px solid rgba(139,169,198,.22);border-radius:13px;background:linear-gradient(180deg,#13293d,#0e2133);color:#f8fbff;padding:6px 8px;font-size:13px;line-height:1.1;box-shadow:inset 0 1px 0 rgba(255,255,255,.025)}.box{width:24px;height:24px;border:2px solid #73889c;border-radius:6px;display:grid;place-items:center;font-weight:900}.ico{width:34px;height:34px;border-radius:9px;background:rgba(255,255,255,.035);display:grid;place-items:center}.ico svg{width:26px;height:26px;stroke:v :9px;letter-spacing:1.3px;color:#7f93a6;text-transform:uppercase}.foot:after{content:"";position:absolute;right:70px;bottom:-4px;width:260px;height:22px;opacity:.35;background:linear-gradient(150deg,transparent 15%,#1a3550 16% 28%,transparent 29%),linear-gradient(210deg,transparent 22%,#132b42 23% 40%,transparent 41%)}.heart{color:#ff4663}.modalbg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:10;align-items:center;justify-content:center}.modal{width:380px;padding:20px;border:1px solid #36536e;border-radius:18px;background:#0d2032}.modal h2{margin-top:0}.modal p{color:#9db0c3}.actions{display:flex;justify-content:flex-end;gap:8px}.action{padding:10px 14px;border-radius:9px;border:1px solid #36536e;background:#173047;color:#fff}</style></head><body><div class="app"><header class="top"><div class="brand"><div class="logo"></div><div><div class="title">Family Chores</div><div class="tag">A CLEANER HOME&nbsp;&nbsp; A HAPPIER FAMILY</div></div></div><div class="right"><div class="date"><b id="day"></b><span id="date"></span></div><button class="gear" id="settings">⚙</button></div></header><main class="cards" id="cards"></main><section class="every"><div class="everyTop"><div class="everyTitle"><svg class="sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4" fill="#ffd33d"/><g stroke="#ffd33d" stroke-width="2"><path d="M12 1v3M12 20v3M1 12h3M20 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M19.8 4.2l-2.1 2.1M6.3 17.7l-2.1 2.1"/></g></svg><b>Every Day</b></div><span>THE BASICS</span></div><div class="basicsRow"><div class="basicItem"><svg viewBox="0 0 24 24"><path d="M3 18V8h3v6h15v4M6 14V9h5a3 3 0 0 1 3 3v2"/></svg>Bed</div><div class="basicItem"><svg viewBox="0 0 24 24"><path d="M8 5l4 2 4-2 4 4-3 3v8H7v-8L4 9z"/></svg>Clothes</div><div class="basicItem"><svg viewBox="0 0 24 24"><path d="M5 3v7M8 3v7M5 7h3M6.5 10v11M15 3v18M19 3c2 5 1 8-1 9"/></svg>Dishes</div><div class="basicItem"><svg viewBox="0 0 24 24"><path d="M4 20l7-7M10 14l4 4M12 12l5-8M14 18l4 2M11 15l-4 4"/></svg>Floor</div><div class="basicItem"><svg viewBox="0 0 24 24"><path d="M6 7h12l-1 14H7L6 7zM9 7V4h6v3M4 7h16"/></svg>Rubbish</div></div><div class="everyGrid" id="every"></div></section><footer class="foot"><span>Consistency today creates freedom tomorrow</span><span>Jackson Family <span class="heart">♥</span></span></footer></div><div class="modalbg" id="modal"><div class="modal"><h2>Reset today?</h2><p>Clear every completed job for today?</p><div class="actions"><button class="action" id="cancel">Cancel</button><button class="action" id="reset">Reset</button></div></div></div><script>(function(){var kids=['Indie','Lola','Gideon'],cls=['indie','lola','gideon'],cheer=['Good work, Indie!','You’ve got this!','Legend!'];var roleIcons=['<svg viewBox="0 0 24 24"><path d="M7 14c-2 0-3 2-2 4 1 2 4 1 5 0 1 2 4 3 5 1 1-2-1-4-3-4-2 0-3-1-5-1z"/><circle cx="6" cy="8" r="2"/><circle cx="11" cy="6" r="2"/><circle cx="16" cy="8" r="2"/></svg>','<svg viewBox="0 0 24 24"><path d="M4 3v7M7 3v7M4 7h3M5.5 10v11M14 3l6 6M13 10l7-7M14 10l6 6M13 11l-8 8"/></svg>','<svg viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v10h-6v-6H9v6H3z"/></svg>'];var scenes=[`<svg class="scene" viewBox="0 0 400 180" preserveAspectRatio="none"><defs><linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ff54ae"/><stop offset="1" stop-color="#4d1d79"/></linearGradient></defs><rect width="400" height="180" fill="url(#a)"/><circle cx="320" cy="34" r="28" fill="#ffb4dd" opacity=".22"/><path d="M0 150L65 90l42 35 53-68 70 80 46-54 124 67v30H0z" fill="#301040" opacity=".82"/><path d="M0 150c55-20 85-17 125-7 48 12 90 10 130-3 50-16 94-13 145 6v34H0z" fill="#160b25" opacity=".92"/></svg>`,`<svg class="scene" viewBox="0 0 400 180" preserveAspectRatio="none"><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#21c9ff"/><stop offset="1" stop-color="#064b8a"/></linearGradient></defs><rect width="400" height="180" fill="url(#b)"/><path d="M0 145L70 90l38 34 48-65 64 70 45-51 135 67v35H0z" fill="#0a3154" opacity=".78"/><path d="M0 154c70-18 102-17 155-6 55 12 111 8 160-5 31-8 58-7 85 0v37H0z" fill="#061d32" opacity=".9"/></svg>`,`<svg class="scene" viewBox="0 0 400 180" preserveAspectRatio="none"><defs><linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#43e77d"/><stop offset="1" stop-color="#085e42"/></linearGradient></defs><rect width="400" height="180" fill="url(#c)"/><path d="M0 144L64 96l43 31 46-58 66 62 50-49 131 62v36H0z" fill="#0a5137" opacity=".77"/><path d="M0 154c56-15 99-17 148-7 57 12 102 9 151-4 36-9 69-9 101 0v37H0z" fill="#062d23" opacity=".92"/></svg>`];var roles=[{name:'Dogs & Outside',tasks:[['Pick up dog poo','poo'],['Clean & refill dog water','bowl'],['Feed the dogs','bone'],['Pool robot + clean filter','robot'],['Quick outdoor tidy','leaf']]},{name:'Kitchen',tasks:[['Unload dishwasher','washer'],['Clear / load dinner dishes','plates'],['Wipe table & benches','table'],['Rubbish & recycling','bin']]},{name:'House',tasks:[['Vacuum / sweep main area','broom'],['Reset lounge room','chair'],['Collect laundry & towels','shirt'],['Fold / put away washing if needed','washer']]}];var icon={poo:'<svg viewBox="0 0 24 24"><path d="M8 19c-3 0-4-3-2-5 1-1 2-1 3-1-1-2 0-4 2-5 0-2 1-4 3-5 0 3 3 4 3 7 2 0 4 2 4 4 0 3-2 5-5 5z"/></svg>',bowl:'<svg viewBox="0 0 24 24"><path d="M4 10h16l-2 8H6l-2-8zM7 7c1-2 3-3 5-3s4 1 5 3"/></svg>',bone:'<svg viewBox="0 0 24 24"><path d="M7 9l10 6M6 7a2 2 0 1 1-3 3 2 2 0 1 1 3 3l12-12a2 2 0 1 1 3 3 2 2 0 1 1-3 3L6 19a2 2 0 1 1-3-3 2 2 0 1 1 3-3"/></svg>',robot:'<svg viewBox="0 0 24 24"><rect x="5" y="8" width="14" height="10" rx="3"/><circle cx="9" cy="13" r="1"/><circle cx="15" cy="13" r="1"/><path d="M9 18v2M15 18v2M10 8V5h4v3"/></svg>',leaf:'<svg viewBox="0 0 24 24"><path d="M4 18c7 0 12-5 14-12-7 0-12 4-14 12zM8 16l9-9M6 19l-2 2"/></svg>',washer:'<svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><circle cx="12" cy="13" r="5"/><path d="M8 6h2M14 6h2"/></svg>',plates:'<svg viewBox="0 0 24 24"><ellipse cx="12" cy="7" rx="7" ry="3"/><path d="M5 7v4c0 2 3 3 7 3s7-1 7-3V7M5 11v4c0 2 3 3 7 3s7-1 7-3v-4"/></svg>',table:'<svg viewBox="0 0 24 24"><path d="M4 8h16v4H4zM6 12v8M18 12v8"/></svg>',bin:'<svg viewBox="0 0 24 24"><path d="M6 7h12l-1 14H7L6 7zM9 7V4h6v3M4 7h16"/></svg>',broom:'<svg viewBox="0 0 24 24"><path d="M15 3l-4 11M9 13l6 2-2 6-7-3 3-5z"/></svg>',chair:'<svg viewBox="0 0 24 24"><path d="M6 12V8a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v4M4 12h16v6H4zM6 18v3M18 18v3"/></svg>',shirt:'<svg viewBox="0 0 24 24"><path d="M8 5l4 2 4-2 4 4-3 3v8H7v-8L4 9z"/></svg>'};var anchor=new Date(2026,8,9,12);function pad(n){return n<10?'0'+n:n}function key(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}function mod(n,m){return((n%m)+m)%m}function dd(a,b){return Math.round((new Date(b.getFullYear(),b.getMonth(),b.getDate(),12)-new Date(a.getFullYear(),a.getMonth(),a.getDate(),12))/86400000)}var now=new Date(),today=key(now),off=mod(dd(anchor,now),3);function role(i){return roles[mod(i+off,3)]}function sk(i,t,j){return'jackson-chores:'+today+':'+i+':'+t+':'+j}function done(i,t,j){return localStorage.getItem(sk(i,t,j))==='1'}function set(i,t,j,v){if(v)localStorage.setItem(sk(i,t,j),'1');else localStorage.removeItem(sk(i,t,j))}function basic(i){return done(i,'every','all')}function counts(i){var r=role(i),d=basic(i)?1:0;r.tasks.forEach(function(_,j){if(done(i,'role',j))d++});return[d,r.tasks.length+1]}function task(i,j,t){var b=document.createElement('button');b.className='task'+(done(i,'role',j)?' done':'');b.innerHTML='<span class="box">'+(done(i,'role',j)?'✓':'')+'</span><span class="ico">'+icon[t[1]]+'</span><span class="label">'+t[0]+'</span>';b.onclick=function(){set(i,'role',j,!done(i,'role',j));build()};return b}function build(){document.getElementById('day').textContent=now.toLocaleDateString(undefined,{weekday:'long'});document.getElementById('date').textContent=now.toLocaleDateString(undefined,{day:'numeric',month:'long',year:'numeric'});var c=document.getElementById('cards');c.innerHTML='';kids.forEach(function(k,i){var r=role(i),n=counts(i),pct=Math.round(n[0]/n[1]*100),card=document.createElement('section');card.className='card '+cls[i];card.innerHTML='<div class="hero">'+scenes[i]+'<div class="heroShade"></div><div class="heroTop"><div><div class="who"><span class="roleicon">'+roleIcons[i]+'</span><span class="name">'+k+'</span></div><div class="role">'+r.name+'</div></div><div class="ring" style="--p:'+pct+'"><span>'+n[0]+'/'+n[1]+'</span></div></div></div>';var ts=document.createElement('div');ts.className='tasks';ts.style.gridTemplateRows='repeat('+r.tasks.length+',1fr)';r.tasks.forEach(function(t,j){ts.appendChild(task(i,j,t))});card.appendChild(ts);var ch=document.createElement('div');ch.className='cheer';ch.textContent=cheer[i];card.appendChild(ch);c.appendChild(card)});var e=document.getElementById('every');e.innerHTML='';kids.forEach(function(k,i){var p=document.createElement('div');p.className='person';p.innerHTML='<div class="pname">'+k+'</div>';var b=document.createElement('button');b.className='all'+(basic(i)?' done':'');b.textContent=basic(i)?'✓ ALL DONE':'ALL DONE';b.onclick=function(){set(i,'every','all',!basic(i));build()};p.appendChild(b);e.appendChild(p)})}document.getElementById('settings').onclick=function(){document.getElementById('modal').style.display='flex'};document.getElementById('cancel').onclick=function(){document.getElementById('modal').style.display='none'};document.getElementById('reset').onclick=function(){kids.forEach(function(_,i){role(i).tasks.forEach(function(_,j){localStorage.removeItem(sk(i,'role',j))});localStorage.removeItem(sk(i,'every','all'))});document.getElementById('modal').style.display='none';build()};setInterval(function(){if(key(new Date())!==today)location.reload()},60000);build()})();</script></body></html>
