name: Install Dinner Vote

on:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/install-dinner-vote.yml'
      - 'dinner-vote.js'
      - 'dinner-vote.css'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix Dinner Vote editor sync
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          js_path = Path('dinner-vote.js')
          s = js_path.read_text(encoding='utf-8')

          s = s.replace(
              "setInterval(function(){loadCloud(function(){})},5000)",
              "setInterval(function(){var s=byId('dvSettings');if(!(s&&s.className.indexOf('open')>=0))loadCloud(function(){})},5000)"
          )

          s = s.replace(
              "function openSettings(){populateSettings();var e=byId('dvSettings');if(e)e.className='dvOverlay open';loadCloud(function(){populateSettings()})}",
              "function openSettings(){var e=byId('dvSettings');if(e)e.className='dvOverlay open';if(cloudReady){populateSettings()}else{loadCloud(function(){populateSettings()})}}"
          )

          s = s.replace(
              "function refreshOpenPanels(){var v=byId('dvOverlay'),s=byId('dvSettings');if(v&&v.className.indexOf('open')>=0){renderVoters();renderMeals()}if(s&&s.className.indexOf('open')>=0)populateSettings()}",
              "function refreshOpenPanels(){var v=byId('dvOverlay');if(v&&v.className.indexOf('open')>=0){renderVoters();renderMeals()}}"
          )

          js_path.write_text(s, encoding='utf-8')

          index_path = Path('index.html')
          html = index_path.read_text(encoding='utf-8')
          css = '<link rel="stylesheet" href="dinner-vote.css?v=20260910-v1">'
          js = '<script src="dinner-vote.js?v=20260910-cloud2"></script>'
          if 'dinner-vote.css' not in html:
              html = html.replace('</head>', css + '\n</head>')
          if 'dinner-vote.js' not in html:
              html = html.replace('</body>', js + '\n</body>')
          else:
              html = re.sub(r'<script src="dinner-vote\.js\?v=[^"]+"></script>', js, html)
          index_path.write_text(html, encoding='utf-8')
          PY
      - name: Commit Dinner Vote fix
        run: |
          if git diff --quiet -- dinner-vote.js index.html; then
            echo "Dinner Vote fix already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dinner-vote.js index.html
          git commit -m "Keep Dinner Vote settings stable while editing"
          git push
