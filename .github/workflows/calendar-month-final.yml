name: Finalize Family Calendar month view
on:
  push:
    branches: [calendar-month-view]
    paths: ['.github/workflows/calendar-month-final.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned test tools
        run: |
          python -m pip install --quiet PyYAML==6.0.2 Pillow==11.3.0 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Apply the reviewed month patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml,subprocess
          workflow=yaml.safe_load(Path('.github/workflows/calendar-month-view.yml').read_text())
          steps=workflow['jobs']['month']['steps']
          patch=next(s['run'] for s in steps if s.get('name')=='Apply month view to calendar only')
          subprocess.run(['bash','-e','-c',patch],check=True)
          PY
      - name: Run full browser checks including mobile PIN transitions
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml,subprocess
          workflow=yaml.safe_load(Path('.github/workflows/calendar-month-view.yml').read_text())
          steps=workflow['jobs']['month']['steps']
          tests=next(s['run'] for s in steps if s.get('name')=='Test month layout, dates, shifts, popups and unchanged chore screen')
          old="document.getElementById('fc4PinError').textContent.indexOf('not accepted')>=0"
          new="document.getElementById('fc4PinError') && document.getElementById('fc4PinError').textContent.indexOf('not accepted')>=0"
          assert tests.count(old)==1
          tests=tests.replace(old,new)
          subprocess.run(['bash','-e','-c',tests],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: calendar-month-final-review
          path: ${{ runner.temp }}/month-review/
      - name: Commit verified calendar site files only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add family-calendar-foundry4.js family-calendar-foundry4.css index.html calendar.html
          git diff --cached --stat
          git commit -m 'Switch Family Calendar to tested month view while retaining industrial artwork and shift colours'
          git push origin HEAD:calendar-month-view
